services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  nginx:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Publica a porta 80 no host — necessário para "docker compose up" direto
    # numa VPS crua. No EasyPanel (ou qualquer plataforma com proxy próprio,
    # tipo Traefik/Coolify), REMOVA este bloco "ports" e, em vez disso,
    # configure um Domain apontando pro serviço "nginx", porta 80 — evita
    # conflito com a porta 80 que a própria plataforma já usa, e normalmente
    # já ganha HTTPS automático de brinde.
    ports:
      - "80:80"
    volumes:
      - media_data:/media
      - static_data:/static

volumes:
  db_data:
  media_data:
  static_data:
