services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DB_ENGINE: ${DB_ENGINE}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL}
    depends_on:
      - db
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  nginx:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Sem "ports" aqui de propósito — este compose é usado no EasyPanel (ou
    # qualquer plataforma com proxy próprio, tipo Traefik/Coolify), que já
    # ocupa a porta 80 do host e expõe o serviço via Domain (ver README).
    # Rodando "docker compose up" numa VPS crua, sem EasyPanel, adicione:
    #   ports:
    #     - "80:80"
    volumes:
      - media_data:/media
      - static_data:/static

volumes:
  db_data:
  media_data:
  static_data:
