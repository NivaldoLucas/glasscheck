services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-glasscheck}
      POSTGRES_USER: ${DB_USER:-glasscheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/Recife
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

  # frontend web (a definir o framework — placeholder para quando o projeto existir)
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"

volumes:
  db_data:
  n8n_data:
